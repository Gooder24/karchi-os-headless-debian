# When memory runs out, what an agent can start again goes first: a browser, a VM, a compiler. What holds the
# agents' work and the way in (T3, Claude Code and its helpers, named by its version, Codex, SSH, Tailscale, caddy,
# the databases listed, systemd) is never chosen. SIGTERM at 8 % of memory, SIGKILL at 5 % (asus froze on
# 2026-11-05: a thrashing process ignored SIGTERM and nothing sent SIGKILL). Same on every machine; /etc/default/earlyoom is no longer
# read. ($$ is a dollar sign for systemd.)
[Service]
EnvironmentFile=
ExecStart=
ExecStart=/usr/bin/earlyoom -m 8,5 -s 10,5 -r 3600 --sort-by-rss \
  --prefer ^(chromium|chrome|headless_shell|qemu-system-.*|cc1|cc1plus|rustc|ld|ld.lld|java)$$ \
  --ignore ^(t3.*|node-MainThread|claude|[0-9][0-9.]*|codex.*|opencode|hermes|sshd|sshd-session|tailscaled|systemd|systemd-.*|dockerd|containerd|containerd-shim|postgres|.postgres-wrapp|mariadbd|redis-server|tuwunel|caddy)$$
