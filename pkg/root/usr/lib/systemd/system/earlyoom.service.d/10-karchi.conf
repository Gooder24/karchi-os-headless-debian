# When memory runs out, what an agent can start again goes first: a browser, a VM, a compiler. What holds the
# agents' work and the way in (T3, Claude Code, Codex, SSH, Tailscale, databases, systemd) is never chosen.
# Same on every machine; /etc/default/earlyoom is no longer read. ($$ is a dollar sign for systemd.)
[Service]
EnvironmentFile=
ExecStart=
ExecStart=/usr/bin/earlyoom -m 8,4 -s 10,5 -r 3600 --sort-by-rss \
  --prefer ^(chromium|chrome|headless_shell|qemu-system-.*|cc1|cc1plus|rustc|ld|ld.lld|java)$$ \
  --ignore ^(t3.*|node-MainThread|claude|codex.*|opencode|hermes|sshd|sshd-session|tailscaled|systemd|systemd-.*|dockerd|containerd|containerd-shim|postgres|mariadbd|redis-server|tuwunel)$$
