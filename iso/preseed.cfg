# Answers for the Debian installer, read from its initrd before the first question.
# Left for the person at the keyboard: keyboard, name of the machine, user and password, the disk and the
# confirmation that it may be overwritten, and our own questions (iso/questions).
# The test in a VM answers those on the kernel command line (tools/vm.py).

d-i debian-installer/locale string en_US.UTF-8

# No network during the installation: everything comes from this medium. The installed system connects
# through iwd and systemd-networkd, which the installer knows nothing about.
d-i netcfg/enable boolean false
d-i netcfg/get_hostname string karchi-server
d-i netcfg/get_hostname seen false
d-i netcfg/get_domain string
d-i hw-detect/load_firmware boolean true

# No root password: the user gets sudo and root stays locked.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# The time zone is one of our own questions; this is what it starts from.
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean false
d-i time/zone string Europe/Bratislava

# The whole disk: an EFI partition and btrfs on the rest, no swap partition (swap is zram).
# Which disk, and "write the changes to disks?", are asked.
d-i partman-auto/method string regular
d-i partman-auto/expert_recipe string karchi :: \
    512 512 512 free $iflabel{ gpt } $reusemethod{ } method{ efi } format{ } . \
    4096 4096 -1 btrfs method{ format } format{ } use_filesystem{ } filesystem{ btrfs } mountpoint{ / } .
d-i partman-auto/choose_recipe select karchi
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/choose_partition select finish

d-i base-installer/kernel/image string linux-image-amd64
d-i base-installer/install-recommends boolean false

# Packages from this medium only; iso/late writes the network sources of the installed system.
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/use_mirror boolean false
d-i apt-setup/no_mirror boolean true
d-i apt-setup/services-select multiselect
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/disable-cdrom-entries boolean true
tasksel tasksel/first multiselect
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# Also to the fallback path of the EFI partition: the machine then starts even when its firmware forgets the entry.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/force-efi-extra-removable boolean true

d-i partman/early_command string sh /cdrom/karchi/questions
d-i preseed/late_command string sh /cdrom/karchi/late
d-i cdrom-detect/eject boolean false
d-i finish-install/reboot_in_progress note
