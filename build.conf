# KarchiOS Headless (Debian) build configuration.
# Read by make (include), bash (source) and tools/vm.py — keep it KEY=value, no spaces, no quotes.

OS_ID=karchios-headless-debian

# The official netinst ISO the build starts from.
DEBIAN_VERSION=13.7.0
DEBIAN_SUITE=trixie
DEBIAN_ISO_SHA256=a7ef94ac2fb9a7fec454552abd629b7cc9d5155c886165a45649f5ce6167e355

# Test VM (unattended install + boot of the result). The host has 15 GB of memory and is often full:
# free -h before a test, and not while the VMs of ~/Work/karchi-os or karchi-os-headless run.
TEST_DISK_GB=16
TEST_RAM_MB=2048
TEST_CPUS=2
TEST_SSH_PORT=2242
